services:
  - type: web
    name: dancing-rat-mini-app
    runtime: static
    buildCommand: "echo \"Serving Dancing Rat Mini App\""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: worker
    name: dancing-rat-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
