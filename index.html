<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Танцующая крыса</title>
<link rel="preload" as="image" href="./intro.gif"><style>
:root{--bg:#ffffff;--bg2:#ffffff;--ink:#4a0f2e;--btn:#e0156f;--btnink:#fff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Trebuchet MS",sans-serif;color:var(--ink);background:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#intro{position:absolute;z-index:1;left:50%;top:68%;transform:translate(-50%,-50%);width:min(32vw,160px);max-height:35%;object-fit:contain;display:none;pointer-events:none;filter:drop-shadow(0 8px 18px #0005)}
.stage{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;perspective:900px;position:relative;min-height:0}.floor{position:absolute;bottom:2%;width:40vmin;height:5vmin;border-radius:50%;background:#0003;filter:blur(6px);transition:transform .1s}
#ratWrap{height:78%;max-height:80vh;width:auto;max-width:90vw;position:relative;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 95%;will-change:transform;user-select:none}#rat{height:100%;max-height:100%;width:auto;max-width:100%;object-fit:contain;user-select:none}#mouth{position:absolute;left:50%;top:38%;width:9%;height:2.2%;min-width:12px;min-height:4px;transform:translate(-50%,-50%) scaleY(.18);transform-origin:center;border-radius:50%;background:#401020;box-shadow:inset 0 1px 1px #0008;opacity:0;pointer-events:none;transition:transform .07s linear,opacity .12s}
audio{display:none}.panel{position:relative;z-index:10;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));width:100%}
button{font:inherit;font-weight:700;background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:12px 26px}label{display:flex;align-items:center;gap:8px;font-size:15px}input[type=range]{width:140px;accent-color:var(--btn)}select{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--btn);background:transparent;color:var(--ink)}
</style></head><body><div class="stage"><img id="intro" src="./intro.gif" alt="" aria-hidden="true"><div class="floor" id="floor"></div><div id="ratWrap"><img id="rat" src="https://raw.githubusercontent.com/litvinov57alex-bot/dancing-rat-telegram/main/rat.png" alt="Исходная розовая крыса с человеческим лицом"><div id="mouth" aria-hidden="true"></div></div></div>
<div class="panel"><button id="go" aria-pressed="false">Танцевать</button><audio id="song" preload="auto"><source src="./Gazan%20-%2067%20%28hitmo.net%29.mp3" type="audio/mpeg"></audio><label>Темп <input id="bpm" type="range" min="70" max="200" value="128"><output id="bpmv">128</output></label><label>Стиль <select id="style"><option value="0">Качалка</option><option value="1">Прыжки</option><option value="2">Твист</option><option value="3">Хаос</option></select></label></div>
<script>
(() => {
  const rat = document.getElementById('rat');
  const ratWrap = document.getElementById('ratWrap');
  const mouth = document.getElementById('mouth');
  const floor = document.getElementById('floor');
  const go = document.getElementById('go');
  const song = document.getElementById('song');
  const intro = document.getElementById('intro');
  let introTimer = null;
  let savedBpm = null;
  const bpm = document.getElementById('bpm');
  const bpmv = document.getElementById('bpmv');
  const sty = document.getElementById('style');
  let dancing = false;
  let audioContext = null, analyser = null, audioSource = null, audioFrame = null;
  const audioData = new Uint8Array(64);

  function sing() {
    if (!dancing || !analyser) { mouth.style.opacity = '0'; return; }
    analyser.getByteFrequencyData(audioData);
    let level = 0;
    for (let i = 0; i < audioData.length; i++) level += audioData[i];
    level = level / audioData.length / 255;
    const opening = Math.min(1, Math.max(.12, level * 3.8));
    mouth.style.opacity = String(Math.min(1, .35 + level * 2));
    mouth.style.transform = 'translate(-50%,-50%) scaleY(' + opening + ')';
    audioFrame = requestAnimationFrame(sing);
  }

  function startSinging() {
    try {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        audioSource = audioContext.createMediaElementSource(song);
        audioSource.connect(analyser);
        analyser.connect(audioContext.destination);
      }
      audioContext.resume();
      cancelAnimationFrame(audioFrame);
      sing();
    } catch (error) { console.warn('Анимация пения недоступна:', error); }
  }
  let startedAt = 0;
  const reducedMotion = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
    : false;

  bpm.addEventListener('input', () => { bpmv.textContent = bpm.value; });

  function animate() {
    if (!dancing) return;
    const period = 60 / Number(bpm.value || 128);
    const p = (performance.now() - startedAt) / 1000 / period;
    const phase = p * Math.PI * 2;
    const style = Number(sty.value);
    const k = reducedMotion ? 0.25 : 1;
    let x = 0, y = 0, rotation = 0, sx = 1, sy = 1, ry = 0;
    const hit = Math.pow(Math.abs(Math.sin(p * Math.PI)), 3);

    if (style === 0) {
      rotation = Math.sin(phase / 2) * 10 * k;
      x = Math.sin(phase / 2) * 4 * k;
      sy = 1 + hit * 0.03 * k;
      sx = 1 - hit * 0.02 * k;
    } else if (style === 1) {
      y = -hit * 14 * k;
      sy = 1 + hit * 0.06 * k;
      sx = 1 - hit * 0.04 * k;
      rotation = Math.sin(phase / 2) * 4 * k;
    } else if (style === 2) {
      ry = Math.sin(phase / 2) * 35 * k;
      rotation = Math.sin(phase) * 5 * k;
      y = -hit * 4 * k;
    } else {
      rotation = Math.sin(phase * 1.5) * 14 * k;
      x = Math.sin(phase / 2) * 8 * k;
      y = -Math.abs(Math.sin(phase * 0.75)) * 10 * k;
      ry = Math.sin(phase / 3) * 25 * k;
      sx = 1 + Math.sin(phase * 2) * 0.04 * k;
      sy = 1 - Math.sin(phase * 2) * 0.04 * k;
    }

    ratWrap.style.transform = 'translate(' + x + 'vmin,' + y + 'vmin) rotate(' + rotation + 'deg) rotateY(' + ry + 'deg) scale(' + sx + ',' + sy + ')';
    floor.style.transform = 'translateX(' + x + 'vmin) scale(' + (1 - y * 0.01) + ')';
    window.requestAnimationFrame(animate);
  }

  go.addEventListener('click', () => {
    if (!dancing) {
      startedAt = performance.now();
      dancing = true;
      intro.style.display = 'block';
      intro.src = './intro.gif';
      clearTimeout(introTimer);
      savedBpm = bpm.value;
      bpm.value = '200';
      bpmv.textContent = '200';
      introTimer = setTimeout(() => {
        intro.style.display = 'none';
        if (savedBpm !== null) { bpm.value = savedBpm; bpmv.textContent = savedBpm; savedBpm = null; }
        sty.value = '1'; // После GIF крыса переключается на прыжки
      }, 2000);
      go.textContent = 'Стоп';
      go.setAttribute('aria-pressed', 'true');
      song.currentTime = 0;
      song.play().then(startSinging).catch(error => console.warn('Не удалось запустить песню 67:', error));
      window.requestAnimationFrame(animate);
    } else {
      dancing = false;
      cancelAnimationFrame(audioFrame);
      mouth.style.opacity = '0';
      mouth.style.transform = 'translate(-50%,-50%) scaleY(.18)';
      clearTimeout(introTimer);
      intro.style.display = 'none';
      if (savedBpm !== null) { bpm.value = savedBpm; bpmv.textContent = savedBpm; savedBpm = null; }
      go.textContent = 'Танцевать';
      go.setAttribute('aria-pressed', 'false');
      song.pause();
      song.currentTime = 0;
      ratWrap.style.transform = '';
      floor.style.transform = '';
    }
  });
})();
</script></body></html>
