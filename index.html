<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Танцующая крыса</title>
<link rel="preload" as="image" href="./intro.gif"><style>
:root{--bg:#ffffff;--bg2:#ffffff;--ink:#4a0f2e;--btn:#e0156f;--btnink:#fff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Trebuchet MS",sans-serif;color:var(--ink);background:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#intro{position:absolute;z-index:5;left:50%;top:62%;transform:translate(-50%,-50%);width:min(42vw,210px);max-height:52%;object-fit:contain;display:none;pointer-events:none;filter:drop-shadow(0 8px 18px #0005)}
.stage{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;perspective:900px;position:relative;min-height:0}.floor{position:absolute;bottom:2%;width:40vmin;height:5vmin;border-radius:50%;background:#0003;filter:blur(6px);transition:transform .1s}
#rat{height:78%;max-height:80vh;width:auto;max-width:90vw;object-fit:contain;transform-origin:50% 95%;will-change:transform;user-select:none}
audio{display:none}.panel{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));width:100%}
button{font:inherit;font-weight:700;background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:12px 26px}label{display:flex;align-items:center;gap:8px;font-size:15px}input[type=range]{width:140px;accent-color:var(--btn)}select{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--btn);background:transparent;color:var(--ink)}
</style></head><body><div class="stage"><img id="intro" src="./intro.gif" alt="" aria-hidden="true"><div class="floor" id="floor"></div><img id="rat" src="https://raw.githubusercontent.com/litvinov57alex-bot/dancing-rat-telegram/main/rat.png" alt="Исходная розовая крыса с человеческим лицом"></div>
<div class="panel"><button id="go" aria-pressed="false">Танцевать</button><audio id="song" preload="auto"><source src="./Gazan%20-%2067%20%28hitmo.net%29.mp3" type="audio/mpeg"></audio><label>Темп <input id="bpm" type="range" min="70" max="200" value="128"><output id="bpmv">128</output></label><label>Стиль <select id="style"><option value="0">Качалка</option><option value="1">Прыжки</option><option value="2">Твист</option><option value="3">Хаос</option></select></label></div>
<script>
(() => {
  const rat = document.getElementById('rat');
  const floor = document.getElementById('floor');
  const go = document.getElementById('go');
  const song = document.getElementById('song');
  const intro = document.getElementById('intro');
  let introTimer = null;
  const bpm = document.getElementById('bpm');
  const bpmv = document.getElementById('bpmv');
  const sty = document.getElementById('style');
  let dancing = false;
  let startedAt = 0;
  const reducedMotion = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
    : false;

  bpm.addEventListener('input', () => { bpmv.textContent = bpm.value; });

  function animate() {
    if (!dancing) return;
    const period = 60 / Number(bpm.value || 128);
    const p = (performance.now() - startedAt) / 1000 / period;
    const phase = p * Math.PI * 2;
    const style = Number(sty.value);
    const k = reducedMotion ? 0.25 : 1;
    let x = 0, y = 0, rotation = 0, sx = 1, sy = 1, ry = 0;
    const hit = Math.pow(Math.abs(Math.sin(p * Math.PI)), 3);

    if (style === 0) {
      rotation = Math.sin(phase / 2) * 10 * k;
      x = Math.sin(phase / 2) * 4 * k;
      sy = 1 + hit * 0.03 * k;
      sx = 1 - hit * 0.02 * k;
    } else if (style === 1) {
      y = -hit * 14 * k;
      sy = 1 + hit * 0.06 * k;
      sx = 1 - hit * 0.04 * k;
      rotation = Math.sin(phase / 2) * 4 * k;
    } else if (style === 2) {
      ry = Math.sin(phase / 2) * 35 * k;
      rotation = Math.sin(phase) * 5 * k;
      y = -hit * 4 * k;
    } else {
      rotation = Math.sin(phase * 1.5) * 14 * k;
      x = Math.sin(phase / 2) * 8 * k;
      y = -Math.abs(Math.sin(phase * 0.75)) * 10 * k;
      ry = Math.sin(phase / 3) * 25 * k;
      sx = 1 + Math.sin(phase * 2) * 0.04 * k;
      sy = 1 - Math.sin(phase * 2) * 0.04 * k;
    }

    rat.style.transform = 'translate(' + x + 'vmin,' + y + 'vmin) rotate(' + rotation + 'deg) rotateY(' + ry + 'deg) scale(' + sx + ',' + sy + ')';
    floor.style.transform = 'translateX(' + x + 'vmin) scale(' + (1 - y * 0.01) + ')';
    window.requestAnimationFrame(animate);
  }

  go.addEventListener('click', () => {
    if (!dancing) {
      startedAt = performance.now();
      dancing = true;
      intro.style.display = 'block';
      intro.src = './intro.gif';
      clearTimeout(introTimer);
      introTimer = setTimeout(() => { intro.style.display = 'none'; }, 2000);
      go.textContent = 'Стоп';
      go.setAttribute('aria-pressed', 'true');
      song.currentTime = 0;
      song.play().catch(error => console.warn('Не удалось запустить песню 67:', error));
      window.requestAnimationFrame(animate);
    } else {
      dancing = false;
      clearTimeout(introTimer);
      intro.style.display = 'none';
      go.textContent = 'Танцевать';
      go.setAttribute('aria-pressed', 'false');
      song.pause();
      song.currentTime = 0;
      rat.style.transform = '';
      floor.style.transform = '';
    }
  });
})();
</script></body></html>
